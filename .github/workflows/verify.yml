name: Verify web app
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev --include=optional
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
